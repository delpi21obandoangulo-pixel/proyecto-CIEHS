<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="emblemaTitulo">
  <title id="emblemaTitulo">Emblema del CIEHS: brote con la raíz sumergida en la lámina de agua, dentro de un anillo de hojas</title>
  <!--
    Redibujo del logo oficial que entregó coordinación el 2026-09-13, y que es
    el que preside el mural nuevo. Se vectoriza en vez de recortar el JPEG por
    lo de siempre: aquí mide 64 px en la cabecera y 32 px en el favicon, y un
    mapa de bits a ese tamaño se deshace. Además el JPEG trae fondo blanco
    opaco, que sobre el velo del menú o el hero oscuro se recortaría como un
    parche claro.

    Esta es la versión SIN TEXTO. El logo oficial lleva «CIEHS» y dos líneas
    dentro del círculo: a 64 px esas líneas son una mancha, así que aquí solo
    queda el dibujo, y el logotipo completo vive en logo-ciehs.svg.

    Qué cambia respecto al emblema anterior:
      · el anillo ya no es un aro liso y cerrado: se abre arriba para dejar
        salir el brote y lleva DOS HOJAS insertadas abajo, a los lados;
      · el agua ya no rellena la mitad inferior del círculo — son dos ONDAS de
        lado a lado, la lámina, y la raíz las cruza por delante;
      · la raíz es azul marino y baja del mismo tallo del brote: es el eje
        vertical que sostiene todo el dibujo.

    Simplificaciones deliberadas respecto al original: cuatro ramas de raíz en
    vez de siete y dos ondas en vez de cuatro. A 32 px lo demás se empasta.

    El fondo es transparente de verdad: lo único opaco es lo dibujado.
    currentColor no se usa a propósito: el emblema va a color pleno en
    cualquier contexto, igual que el escudo de la institución educativa.
  -->
  <defs>
    <linearGradient id="embHoja" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ac143"/>
      <stop offset="1" stop-color="#1b7a3e"/>
    </linearGradient>
    <linearGradient id="embAro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f9e44"/>
      <stop offset="1" stop-color="#1b7a3e"/>
    </linearGradient>
  </defs>

  <!-- anillo abierto por arriba: el brote lo interrumpe, no lo pisa -->
  <path d="M41.2 6.6A27 27 0 1 1 22.8 6.6" fill="none" stroke="url(#embAro)" stroke-width="3.2" stroke-linecap="round"/>

  <!-- las dos hojas del anillo, abajo y apuntando afuera -->
  <g fill="url(#embHoja)">
    <path d="M49 42c7 2.4 11 8 10.6 14.6-7-1.6-11.6-7.6-10.6-14.6z"/>
    <path d="M15 42c-7 2.4-11 8-10.6 14.6 7-1.6 11.6-7.6 10.6-14.6z"/>
  </g>
  <g stroke="#eaf7e0" stroke-width=".9" stroke-linecap="round" fill="none" opacity=".5">
    <path d="M51 45c3 3 5.6 6.4 7.2 9.6"/>
    <path d="M13 45c-3 3-5.6 6.4-7.2 9.6"/>
  </g>

  <!-- brote: hoja central erguida y dos laterales -->
  <path d="M32 24V10" stroke="#1b7a3e" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <g fill="url(#embHoja)">
    <path d="M32 6c-5 4-6.2 12 0 18 6.2-6 5-14 0-18z"/>
    <path d="M30 20c-7-4-14-2-17 3 6 5 14 4 17-1z"/>
    <path d="M34 17c7-4 14-2 17 3-6 5-14 4-17-1z"/>
  </g>
  <g stroke="#eaf7e0" stroke-width=".9" stroke-linecap="round" fill="none" opacity=".6">
    <path d="M28.4 21.4c-4-2-8-3-11.6-3.2"/>
    <path d="M35.6 18.4c4-2 8-3 11.6-3.2"/>
  </g>

  <!-- la lámina de agua, de lado a lado y por debajo de la raíz -->
  <g fill="none" stroke-linecap="round" stroke-width="2.6">
    <path d="M6.5 34.5c3.4-3 6.8-3 10.2 0s6.8 3 10.2 0 6.8-3 10.2 0 6.8 3 10.2 0 6.8-3 10.2 0" stroke="#35b0e8"/>
    <path d="M6.5 41c3.4-3 6.8-3 10.2 0s6.8 3 10.2 0 6.8-3 10.2 0 6.8 3 10.2 0 6.8-3 10.2 0" stroke="#1565c0"/>
  </g>

  <!-- raíz sumergida: lo que dice «hidroponía» y no «huerto» -->
  <g stroke="#123a7a" stroke-width="1.9" stroke-linecap="round" fill="none">
    <path d="M32 24v21"/>
    <path d="M32 31c-4.8 3-7.6 6.4-9 11"/>
    <path d="M32 31c4.8 3 7.6 6.4 9 11"/>
    <path d="M32 37.5c-2.6 2.6-4 5-4.8 8"/>
    <path d="M32 37.5c2.6 2.6 4 5 4.8 8"/>
  </g>
</svg>
