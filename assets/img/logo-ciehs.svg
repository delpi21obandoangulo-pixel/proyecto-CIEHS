<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="logoTitulo">
  <title id="logoTitulo">CIEHS · Centro de Investigación Escolar Hidropónico Sostenible</title>
  <!--
    Logotipo completo, redibujado del logo oficial que entregó coordinación el
    2026-09-13 — el mismo que preside el mural nuevo.

    Deja de ser horizontal. El anterior ponía el dibujo a la izquierda y el
    texto a la derecha; el oficial es CIRCULAR y mete todo dentro del anillo,
    así que este lo sigue. Por eso el viewBox pasó de 300x72 a 256x240 y hay que
    darle alto donde se use.

    El texto va como <text> con la familia del portal y un respaldo genérico, no
    como trazado: si la fuente no carga, el logo sigue siendo legible en lugar
    de descuadrarse. Es la misma decisión que ya tomaba la versión anterior.

    La segunda línea sobresale un poco del anillo por los dos lados. No es un
    descuadre: el original hace lo mismo, es la línea más larga de la marca.

    Fondo transparente. Para fondos oscuros, logo-ciehs-claro.svg.
  -->
  <defs>
    <linearGradient id="lgHoja" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ac143"/>
      <stop offset="1" stop-color="#1b7a3e"/>
    </linearGradient>
    <linearGradient id="lgAro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f9e44"/>
      <stop offset="1" stop-color="#1b7a3e"/>
    </linearGradient>
    <linearGradient id="lgTexto" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f9e44"/>
      <stop offset="1" stop-color="#17703a"/>
    </linearGradient>
  </defs>

  <!-- anillo abierto por arriba: el brote lo interrumpe -->
  <path d="M167.3 11.9A115 115 0 1 1 88.7 11.9" fill="none" stroke="url(#lgAro)" stroke-width="9" stroke-linecap="round"/>

  <!-- Las dos hojas del anillo, a la altura de la lámina de agua y asomando
       por fuera del aro, como en el original. Acaban donde empieza la primera
       línea de texto: en el trazado anterior bajaban hasta los 210 y pisaban
       «ESCOLAR HIDROPÓNICO SOSTENIBLE», que es la línea más ancha del logo. -->
  <g fill="url(#lgHoja)">
    <path d="M196 148c22 8 36 24 38 44-22-4-38-22-38-44z"/>
    <path d="M60 148c-22 8-36 24-38 44 22-4 38-22 38-44z"/>
  </g>
  <g stroke="#eaf7e0" stroke-width="2.8" stroke-linecap="round" fill="none" opacity=".45">
    <path d="M202 158c9 9 16 19 21 28"/>
    <path d="M54 158c-9 9-16 19-21 28"/>
  </g>

  <!-- brote: hoja central erguida y dos laterales -->
  <path d="M128 78V30" stroke="#1b7a3e" stroke-width="8" stroke-linecap="round" fill="none"/>
  <g fill="url(#lgHoja)">
    <path d="M128 14c-15 12-18.6 36 0 54 18.6-18 15-42 0-54z"/>
    <path d="M122 58c-21-12-42-6-51 9 18 15 42 12 51-3z"/>
    <path d="M134 49c21-12 42-6 51 9-18 15-42 12-51-3z"/>
  </g>
  <g stroke="#eaf7e0" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".55">
    <path d="M117 62c-12-6-24-9-35-9.6"/>
    <path d="M139 53c12-6 24-9 35-9.6"/>
  </g>

  <!-- la marca, sobre el tallo -->
  <text x="128" y="140" text-anchor="middle"
        font-family="'Space Grotesk', system-ui, sans-serif" font-size="58" font-weight="700"
        letter-spacing="1" fill="url(#lgTexto)">CIEHS</text>

  <!-- Ondas: de lado a lado y pintadas antes que la raíz, que las cruza por
       delante. Es la lámina de agua del original, no dos pares sueltos. -->
  <g fill="none" stroke-linecap="round" stroke-width="6">
    <path d="M40 154c8.8-7 17.6-7 26.4 0s17.6 7 26.4 0 17.6-7 26.4 0 17.6 7 26.4 0 17.6-7 26.4 0 17.6 7 26.4 0" stroke="#35b0e8"/>
    <path d="M40 168c8.8-7 17.6-7 26.4 0s17.6 7 26.4 0 17.6-7 26.4 0 17.6 7 26.4 0 17.6-7 26.4 0 17.6 7 26.4 0" stroke="#1565c0"/>
  </g>

  <!-- raíz sumergida: el mismo tallo que sostiene las letras sigue hacia abajo -->
  <g stroke="#123a7a" stroke-width="4.5" stroke-linecap="round" fill="none">
    <path d="M128 146v32"/>
    <path d="M128 154c-12 7-19 15-22 26"/>
    <path d="M128 154c12 7 19 15 22 26"/>
    <path d="M128 163c-7 6-10 12-12 19"/>
    <path d="M128 163c7 6 10 12 12 19"/>
  </g>

  <text x="128" y="199" text-anchor="middle"
        font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10"
        letter-spacing=".3" font-weight="600" fill="#123a7a">CENTRO DE INVESTIGACIÓN</text>
  <text x="128" y="215" text-anchor="middle"
        font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10"
        letter-spacing=".3" font-weight="600" fill="#123a7a">ESCOLAR HIDROPÓNICO SOSTENIBLE</text>
</svg>
